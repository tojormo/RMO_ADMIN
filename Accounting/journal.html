<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>とうじょうRMO会計システム | 仕訳入力</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    #lines td { padding: 4px 6px; }
    #lines .rm { border: 1px solid var(--accent); background: var(--paper); color: var(--accent); font-size: 11px; font-weight: 700; height: 32px; padding: 0 10px; white-space: nowrap; }
    #lines .rm:hover { background: var(--accent); color: var(--paper); }
    #lines tfoot td { padding-top: 12px; }
    .bal { font-feature-settings: "tnum"; }
  </style>
</head>
<body data-page="journal">
<main>
  <div class="eyebrow">Journal Entry</div>
  <h1>仕訳入力</h1>
  <p class="sub">借方・貸方を直接入力します。複合仕訳は行を追加してください。貸借が一致すると登録できます（開始残高、立替精算、振替、訂正など）。</p>

  <form id="f" autocomplete="off">
    <div class="card">
      <h2>Header<b>伝票情報</b></h2>
      <div class="grid">
        <div class="c3"><label>取引日<span class="req"></span></label><input type="date" name="date" required></div>
        <div class="c6"><label>摘要<span class="req"></span></label><input name="description" required placeholder="例：細川立替分の精算（10月分）"></div>
        <div class="c3"><label>取引先</label><input name="partner"></div>
        <div class="c3"><label>資金原資</label><select name="fund"></select></div>
        <div class="c3"><label>証憑番号</label><input name="voucherNo"></div>
        <div class="c3"><label>入力者</label><input name="enteredBy"></div>
        <div class="c3"><label id="busLabel">事業</label><select name="business" id="business"></select><div class="hint" id="busHint">明細で事業を選ばなかった行に入ります。収益・費用の行には必須</div></div>
        <div class="c4"><label>予算大項目</label><select name="bl1" id="bl1"></select></div>
        <div class="c4"><label>予算中項目</label><select name="bl2" id="bl2"></select></div>
        <div class="c4"><label>予算小項目</label><select name="bl3" id="bl3"></select><div class="hint" id="budgetHint">予算管理スプレッドシートの最新版から選択。選ぶと実績が予算対比に集計されます</div></div>
      </div>
    </div>

    <div class="card">
      <h2>Lines<b>仕訳明細</b></h2>
      <table id="lines">
        <thead><tr><th style="width:20%">借方科目</th><th class="num" style="width:12%">借方金額</th><th style="width:20%">貸方科目</th><th class="num" style="width:12%">貸方金額</th><th style="width:16%">事業</th><th>行摘要（任意）</th><th></th></tr></thead>
        <tbody></tbody>
        <tfoot><tr class="total"><td>合計</td><td class="num bal" id="dSum">0</td><td></td><td class="num bal" id="cSum">0</td><td id="diff" colspan="3"></td></tr></tfoot>
      </table>
      <div class="actions" style="justify-content:flex-start">
        <button type="button" class="btn ghost small" id="add">＋ 行を追加</button>
        <button type="button" class="btn ghost small" id="tplOpen">テンプレート：開始残高</button>
        <button type="button" class="btn ghost small" id="tplSettle">テンプレート：立替精算</button>
      </div>
    </div>

    <div class="card">
      <h2>Attachment<b>証憑の添付（任意）</b></h2>
      <div class="drop" id="drop">ここにファイルをドラッグ、またはクリックして選択</div>
      <input type="file" id="fileInput" multiple accept="image/*,application/pdf" hidden>
      <ul class="files" id="fileList"></ul>
      <div class="preview" id="preview"></div>
      <div class="actions">
        <button type="submit" class="btn" id="submit" disabled>仕訳を登録</button>
      </div>
    </div>
  </form>
</main>

<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/model.js"></script>
<script src="js/store.js"></script>
<script src="js/widgets.js"></script>
<script src="js/journal.js"></script>
</body>
</html>

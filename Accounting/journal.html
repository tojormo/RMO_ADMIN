<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOJO RMO Accounting System | 仕訳入力</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    #lines td { padding: 4px 6px; }
    #lines .rm { border: 1px solid var(--accent); background: var(--paper); color: var(--accent); font-size: 11px; font-weight: 700; height: 32px; padding: 0 10px; white-space: nowrap; }
    #lines .rm:hover { background: var(--accent); color: var(--paper); }
    #lines tfoot td { padding-top: 12px; }
    .bal { font-feature-settings: "tnum"; }
  </style>
</head>
<body data-page="journal">
<main>
  <div class="eyebrow">Journal Entry</div>
  <h1>仕訳入力</h1>
  <p class="sub">借方・貸方を直接入力します。複合仕訳は行を追加してください。貸借が一致すると登録できます（開始残高、立替精算、振替、訂正など）。</p>

  <form id="f" autocomplete="off">
    <div class="card">
      <h2>Header<b>伝票情報</b></h2>
      <div class="grid">
        <div class="c3"><label>取引日<span class="req"></span></label><input type="date" name="date" required></div>
        <div class="c6"><label>摘要<span class="req"></span></label><input name="description" required placeholder="例：細川立替分の精算（10月分）"></div>
        <div class="c3"><label>取引先</label><input name="partner"></div>
        <div class="c3"><label>資金原資</label><select name="fund"></select></div>
        <div class="c3"><label>証憑番号</label><input name="voucherNo"></div>
        <div class="c3"><label>入力者</label><input name="enteredBy"></div>
        <div class="c3"></div>
        <div class="c4"><label>予算大項目</label><select name="bl1" id="bl1"></select></div>
        <div class="c4"><label>予算中項目</label><select name="bl2" id="bl2"></select></div>
        <div class="c4"><label>予算小項目</label><select name="bl3" id="bl3"></select><div class="hint" id="budgetHint">予算管理スプレッドシートの最新版から選択。選ぶと実績が予算対比に集計されます</div></div>
      </div>
    </div>

    <div class="card">
      <h2>Lines<b>仕訳明細</b></h2>
      <table id="lines">
        <thead><tr><th style="width:24%">借方科目</th><th class="num" style="width:14%">借方金額</th><th style="width:24%">貸方科目</th><th class="num" style="width:14%">貸方金額</th><th>行摘要（任意）</th><th></th></tr></thead>
        <tbody></tbody>
        <tfoot><tr class="total"><td>合計</td><td class="num bal" id="dSum">0</td><td></td><td class="num bal" id="cSum">0</td><td id="diff" colspan="2"></td></tr></tfoot>
      </table>
      <div class="actions" style="justify-content:flex-start">
        <button type="button" class="btn ghost small" id="add">＋ 行を追加</button>
        <button type="button" class="btn ghost small" id="tplOpen">テンプレート：開始残高</button>
        <button type="button" class="btn ghost small" id="tplSettle">テンプレート：立替精算</button>
      </div>
    </div>

    <div class="card">
      <h2>Attachment<b>証憑の添付（任意）</b></h2>
      <div class="drop" id="drop">ここにファイルをドラッグ、またはクリックして選択</div>
      <input type="file" id="fileInput" multiple accept="image/*,application/pdf" hidden>
      <ul class="files" id="fileList"></ul>
      <div class="preview" id="preview"></div>
      <div class="actions">
        <button type="submit" class="btn" id="submit" disabled>仕訳を登録</button>
      </div>
    </div>
  </form>
</main>

<script src="common.js"></script>
<script>
  let M = null;
  const f = document.getElementById('f');
  const tbody = document.querySelector('#lines tbody');
  const picker = FilePicker($('#drop'), $('#fileInput'), $('#fileList'), $('#preview'));

  function acctSelect(value) {
    const s = document.createElement('select');
    fillSelect(s, M.accounts, { groupBy: 'type', label: a => a.code + ' ' + a.name, placeholder: '—' });
    s.value = value || '';
    return s;
  }
  function addLine(l) {
    l = l || {};
    const tr = document.createElement('tr');
    const td = () => tr.appendChild(document.createElement('td'));
    const amt = v => { const i = document.createElement('input'); i.className = 'num'; i.inputMode = 'numeric'; i.value = v ? Number(v).toLocaleString('ja-JP') : ''; i.addEventListener('blur', () => { const n = toInt(i.value); if (n > 0) i.value = n.toLocaleString('ja-JP'); }); return i; };
    td().appendChild(acctSelect(l.d)); td().appendChild(amt(l.da));
    td().appendChild(acctSelect(l.c)); td().appendChild(amt(l.ca));
    const memo = document.createElement('input'); memo.value = l.memo || ''; td().appendChild(memo);
    const rm = document.createElement('button'); rm.type = 'button'; rm.className = 'rm'; rm.textContent = '削除'; rm.title = '行を削除';
    rm.onclick = () => { tr.remove(); recalc(); }; td().appendChild(rm);
    tbody.appendChild(tr); recalc();
  }
  function readLines() {
    return Array.from(tbody.rows).map(tr => {
      const [d, da, c, ca, memo] = tr.querySelectorAll('select, input');
      return { debitAccount: d.value, debitAmount: toInt(da.value) || 0, creditAccount: c.value, creditAmount: toInt(ca.value) || 0, memo: memo.value };
    });
  }
  function recalc() {
    const ls = readLines();
    const d = ls.reduce((t, l) => t + (l.debitAccount ? l.debitAmount : 0), 0);
    const c = ls.reduce((t, l) => t + (l.creditAccount ? l.creditAmount : 0), 0);
    $('#dSum').textContent = fmt(d); $('#cSum').textContent = fmt(c);
    const ok = d > 0 && d === c && ls.every(l => (!l.debitAccount || l.debitAmount > 0) && (!l.creditAccount || l.creditAmount > 0));
    $('#diff').innerHTML = d === c ? (d > 0 ? '<span class="ok">✓ 貸借一致</span>' : '') : '<span class="ng">✕ 差額 ' + fmt(Math.abs(d - c)) + '</span>';
    $('#submit').disabled = !ok;
  }
  tbody.addEventListener('input', recalc); tbody.addEventListener('change', recalc);
  $('#add').onclick = () => addLine();
  $('#tplOpen').onclick = () => {
    tbody.innerHTML = '';
    addLine({ d: '普通預金', memo: '期首残高' }); addLine({ d: '小口現金', memo: '期首残高' }); addLine({ c: '正味財産（繰越金）', memo: '期首残高' });
    f.description.value = f.description.value || '開始残高';
  };
  $('#tplSettle').onclick = () => {
    tbody.innerHTML = '';
    addLine({ d: '未払金', memo: '立替精算' }); addLine({ c: '普通預金', memo: '立替精算' });
    f.description.value = f.description.value || '立替金の精算';
  };

  f.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('#submit'); busy(btn, true);
    try {
      const data = Object.fromEntries(new FormData(f).entries());
      Object.assign(data, bp ? bp.value() : {}); delete data.bl1; delete data.bl2; delete data.bl3;
      data.lines = readLines().filter(l => l.debitAccount || l.creditAccount);
      data.files = await picker.read();
      const res = await run('submitJournal', data);
      toast('仕訳を登録しました：' + res.id + '（' + res.lines + '行・' + yen(res.total) + '）');
      const keep = { date: f.date.value, enteredBy: f.enteredBy.value };
      f.reset(); f.date.value = keep.date; f.enteredBy.value = keep.enteredBy; if (bp) bp.reset();
      tbody.innerHTML = ''; addLine(); addLine(); picker.clear();
    } catch (err) {
      toast('登録できませんでした\n' + esc(err.message || err), true);
      busy(btn, false); recalc(); return;
    }
    busy(btn, false); recalc();
  });

  let bp = null;
  runBudget('getBudgetItems').then(b => {
    bp = BudgetPicker({ l1: $('#bl1'), l2: $('#bl2'), l3: $('#bl3') }, b.items);
    if (b.version) $('#budgetHint').textContent = '予算「' + b.version + '」から選択。選ぶと実績が予算対比に集計されます';
    
  }).catch(err => toast('予算項目を読み込めませんでした\n' + esc(err.message || err), true));

  run('getMasters').then(m => {
    M = m;
    f.date.value = m.today; f.enteredBy.value = m.user || '';
    fillSelect(f.fund, m.funds, { placeholder: '（任意）' });
    addLine(); addLine();
  }).catch(err => toast('マスタを読み込めませんでした\n' + esc(err.message || err), true));
</script>
</body>
</html>

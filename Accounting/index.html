<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>とうじょうRMO会計システム</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
<main>
  <div class="eyebrow">Menu</div>
  <h1>とうじょうRMO会計システム</h1>
  <p class="sub">支払基準・税込。データは会計Ledger（Googleスプレッドシート）に記録されます。</p>
  <div class="tiles">
    <a class="tile" href="entry.html"><span class="no">01</span><span class="eyebrow">Entry</span><span class="t">支払・収入入力</span><span class="d">証憑を添付して、支払・入金を1件ずつ登録</span><span class="go">→</span></a>
    <a class="tile" href="journal.html"><span class="no">02</span><span class="eyebrow">Journal</span><span class="t">仕訳入力</span><span class="d">開始残高、立替精算、振替などを貸借で直接入力</span><span class="go">→</span></a>
    <a class="tile" href="dashboard.html"><span class="no">03</span><span class="eyebrow">Dashboard</span><span class="t">BS・PL ダッシュボード</span><span class="d">貸借対照表・収支計算書・予算対比を表示</span><span class="go">→</span></a>
    <a class="tile ext" href="#" data-ext="LEDGER" target="_blank" rel="noopener"><span class="no">04</span><span class="eyebrow">Ledger</span><span class="t">会計Ledger</span><span class="d">仕訳帳・勘定科目マスタ・試算表（スプレッドシート）</span><span class="go">↗</span></a>
    <a class="tile ext" href="#" data-ext="BUDGET" target="_blank" rel="noopener"><span class="no">05</span><span class="eyebrow">Budget</span><span class="t">予算管理</span><span class="d">当初予算・改訂予算のシート（スプレッドシート）</span><span class="go">↗</span></a>
  </div>
</main>
<script src="common.js"></script>
<script>
  document.querySelectorAll('a[data-ext]').forEach(a => a.href = a.dataset.ext === 'LEDGER' ? LEDGER_URL : BUDGET_URL);
</script>
</body>
</html>

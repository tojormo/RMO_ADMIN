<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOJO RMO Accounting System | ダッシュボード</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body data-page="dashboard">
<main>
  <div class="toolbar">
    <div>
      <div class="eyebrow">Balance Sheet / Profit &amp; Loss</div>
      <h1>BS・PL ダッシュボード</h1>
      <div class="sub" id="period" style="margin:0">読み込み中…</div>
    </div>
    <div class="ctl">
      <div class="fld"><label for="fy">FISCAL YEAR</label><select id="fy"></select></div>
      <button class="btn ghost small" id="reload">更新</button>
    </div>
  </div>
  <div class="warn" id="warn"></div>

  <div class="two">
    <div class="card">
      <h2>Balance Sheet<b>貸借対照表（年度末時点）</b></h2>
      <table id="bs"></table>
    </div>
    <div class="card">
      <h2>Profit &amp; Loss<b>収支計算書（当年度）</b></h2>
      <table id="pl"></table>
    </div>
  </div>

  <div class="stats" id="kpis"></div>

  <div class="two">
    <div class="card">
      <h2>Monthly<b>月次の収益・費用</b></h2>
      <div class="legend"><span><i style="background:var(--lv1)"></i>収益</span><span><i style="background:var(--lv2)"></i>費用</span></div>
      <div class="chart"><canvas id="cMonthly" aria-label="月次の収益と費用"></canvas></div>
    </div>
    <div class="card">
      <h2>Cash<b>資金残高の推移（小口現金＋普通預金、月末）</b></h2>
      <div class="chart"><canvas id="cCash" aria-label="資金残高の推移"></canvas></div>
    </div>
  </div>


  <div class="two">
    <div class="card">
      <h2>Expenses<b>費用の内訳（勘定科目別）</b></h2>
      <div class="chart" id="expWrap"><canvas id="cExp" aria-label="費用の内訳"></canvas></div>
    </div>
    <div class="card">
      <h2>Budget<b>申請書予算項目別 予算対比（費用・税込）</b></h2>
      <table id="budget"></table>
    </div>
  </div>

  <div class="card">
    <h2>Recent<b>当年度の仕訳（新しい順・15件）</b></h2>
    <table id="recent"></table>
  </div>
</main>

<script src="common.js"></script>
<script>
  const css = getComputedStyle(document.documentElement);
  const C = { rev: css.getPropertyValue('--lv1').trim(), exp: css.getPropertyValue('--lv2').trim(), ink: css.getPropertyValue('--ink').trim(), grid: css.getPropertyValue('--hair').trim(), text: css.getPropertyValue('--mute').trim() };
  const charts = {};
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.font.size = 11;
  Chart.defaults.color = C.text;

  const baseOpts = (extra) => Object.assign({
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ' ' + ctx.dataset.label + '：' + yen(ctx.parsed.y ?? ctx.parsed.x) } } },
    scales: {
      x: { grid: { display: false } },
      y: { grid: { color: C.grid }, border: { display: false }, ticks: { callback: v => fmt(v) } },
    },
  }, extra || {});

  function draw(id, cfg) { if (charts[id]) charts[id].destroy(); charts[id] = new Chart(document.getElementById(id), cfg); }

  function render(d) {
    $('#period').textContent = d.fiscalYear + '年度（' + d.period + '）・支払基準・税込　更新 ' + d.generatedAt;
    const sel = $('#fy');
    sel.innerHTML = d.years.map(y => '<option' + (y === d.fiscalYear ? ' selected' : '') + '>' + y + '</option>').join('');

    const w = [];
    if (d.warnings.unbalanced.length) w.push('貸借が一致しない仕訳があります：' + d.warnings.unbalanced.join(', '));
    if (d.warnings.unknownAccounts.length) w.push('勘定科目マスタにない科目が使われています：' + d.warnings.unknownAccounts.join(', '));
    if (d.warnings.bsDiff) w.push('貸借対照表が一致しません（差額 ' + yen(d.warnings.bsDiff) + '）');
    $('#warn').style.display = w.length ? 'block' : 'none';
    $('#warn').innerHTML = w.map(esc).join('<br>');

    const k = [
      ['資金残高', d.bs.cash, '小口現金＋普通預金'],
      ['資産合計', d.bs.assetsTotal, '年度末'],
      ['負債合計', d.bs.liabilitiesTotal, '未払金（立替）など'],
      ['純資産', d.bs.equityTotal, '繰越金＋収支差額'],
      ['当期収益', d.pl.revenueTotal, d.fiscalYear + '年度'],
      ['当期費用', d.pl.expenseTotal, d.fiscalYear + '年度'],
      ['当期収支差額', d.pl.surplus, '収益 − 費用'],
    ];
    $('#kpis').innerHTML = k.map(x => '<div class="stat' + (x[1] < 0 ? ' alert' : '') + '"><div class="l">' + x[0] + '</div><div class="n">' + yen(x[1]) + '</div><div class="s">' + x[2] + '</div></div>').join('');

    const labels = d.monthly.map(m => Number(m.month.slice(5)) + '月');
    draw('cMonthly', { type: 'bar', data: { labels, datasets: [
      { label: '収益', data: d.monthly.map(m => m.revenue), backgroundColor: C.rev, borderRadius: 0, maxBarThickness: 18 },
      { label: '費用', data: d.monthly.map(m => m.expense), backgroundColor: C.exp, borderRadius: 0, maxBarThickness: 18 },
    ] }, options: baseOpts() });
    draw('cCash', { type: 'line', data: { labels, datasets: [
      { label: '資金残高', data: d.monthly.map(m => m.cash), borderColor: C.ink, backgroundColor: C.ink, borderWidth: 2, pointRadius: 4, pointHoverRadius: 6, tension: 0 },
    ] }, options: baseOpts() });

    const ex = d.pl.expense;
    $('#expWrap').style.height = Math.max(160, ex.length * 30 + 40) + 'px';
    draw('cExp', { type: 'bar', data: { labels: ex.map(e => e.name), datasets: [
      { label: '費用', data: ex.map(e => e.amount), backgroundColor: C.exp, borderRadius: 0, maxBarThickness: 18 },
    ] }, options: baseOpts({ indexAxis: 'y', interaction: { mode: 'nearest', axis: 'y', intersect: false },
      scales: { x: { grid: { color: C.grid }, border: { display: false }, ticks: { callback: v => fmt(v) } }, y: { grid: { display: false } } } }) });

    const row = (n, v, cls) => '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td>' + esc(n) + '</td><td class="num">' + fmt(v) + '</td></tr>';
    const head = n => '<tr class="bs-head"><td colspan="2">' + n + '</td></tr>';
    const items = (arr) => arr.length ? arr.map(a => row(a.name, a.amount)).join('') : '<tr><td class="muted" colspan="2">—</td></tr>';
    $('#bs').innerHTML = '<thead><tr><th>科目</th><th class="num">金額（円）</th></tr></thead><tbody>'
      + head('資産の部') + items(d.bs.assets) + row('資産合計', d.bs.assetsTotal, 'total')
      + head('負債の部') + items(d.bs.liabilities) + row('負債合計', d.bs.liabilitiesTotal, 'total')
      + head('純資産の部') + d.bs.equity.map(a => row(a.name, a.amount)).join('')
      + row('前期までの収支差額', d.bs.priorSurplus) + row('当期収支差額', d.bs.surplus)
      + row('純資産合計', d.bs.equityTotal, 'total')
      + row('負債・純資産合計', d.bs.liabilitiesTotal + d.bs.equityTotal, 'total') + '</tbody>';
    $('#pl').innerHTML = '<thead><tr><th>科目</th><th class="num">金額（円）</th></tr></thead><tbody>'
      + head('収益') + items(d.pl.revenue) + row('収益合計', d.pl.revenueTotal, 'total')
      + head('費用') + items(d.pl.expense) + row('費用合計', d.pl.expenseTotal, 'total')
      + row('当期収支差額', d.pl.surplus, 'total') + '</tbody>';

    $('#budget').innerHTML = '<thead><tr><th>予算項目</th><th class="num">予算</th><th class="num">実績</th><th class="num">残額</th><th>執行率</th></tr></thead><tbody>'
      + d.budget.map(b => {
          const rate = b.budget ? b.actual / b.budget : 0;
          return '<tr><td>' + esc(b.name) + '</td><td class="num">' + fmt(b.budget) + '</td><td class="num">' + fmt(b.actual) + '</td><td class="num">' + fmt(b.budget - b.actual) + '</td>'
            + '<td><div class="bar' + (rate > 1 ? ' over' : '') + '" title="' + (rate * 100).toFixed(1) + '%"><span style="width:' + Math.min(100, rate * 100) + '%"></span></div><span class="muted" style="font-size:11px">' + (b.budget ? (rate * 100).toFixed(1) + '%' : '予算なし') + '</span></td></tr>';
        }).join('')
      + (() => { const tb = d.budget.reduce((t, b) => t + b.budget, 0), ta = d.budget.reduce((t, b) => t + b.actual, 0);
          return '<tr class="total"><td>合計</td><td class="num">' + fmt(tb) + '</td><td class="num">' + fmt(ta) + '</td><td class="num">' + fmt(tb - ta) + '</td><td>' + (tb ? (ta / tb * 100).toFixed(1) + '%' : '') + '</td></tr>'; })()
      + '</tbody>';

    $('#recent').innerHTML = '<thead><tr><th>仕訳ID</th><th>日付</th><th>区分</th><th>借方</th><th>貸方</th><th class="num">金額</th><th>取引先・摘要</th><th>証憑</th></tr></thead><tbody>'
      + (d.recent.length ? d.recent.map(r => '<tr><td>' + esc(r.id) + '-' + r.line + '</td><td>' + r.date + '</td><td><span class="pill">' + esc(r.kind) + '</span></td><td>' + esc(r.debit) + '</td><td>' + esc(r.credit) + '</td><td class="num">' + fmt(r.amount) + '</td><td>' + esc(r.partner) + '<div class="muted" style="font-size:12px">' + esc(r.desc) + '</div></td><td>' + (r.url ? '<a href="' + esc(r.url) + '" target="_blank">開く</a>' : '') + '</td></tr>').join('')
        : '<tr><td colspan="8" class="muted">仕訳がありません</td></tr>') + '</tbody>';
  }

  function load(fy) {
    $('#period').textContent = '読み込み中…';
    run('getDashboardData', fy || null).then(render).catch(err => toast('データを読み込めませんでした\n' + esc(err.message || err), true));
  }
  $('#fy').addEventListener('change', e => load(Number(e.target.value)));
  $('#reload').addEventListener('click', () => load(Number($('#fy').value)));
  load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>とうじょうRMO会計システム | ダッシュボード</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body data-page="dashboard">
<main>
  <div class="toolbar">
    <div>
      <div class="eyebrow">Balance Sheet / Profit &amp; Loss</div>
      <h1>BS・PL ダッシュボード</h1>
      <div class="sub" id="period" style="margin:0">読み込み中…</div>
    </div>
    <div class="ctl">
      <div class="fld"><label for="fy">FISCAL YEAR</label><select id="fy"></select></div>
      <button class="btn ghost small" id="reload">更新</button>
    </div>
  </div>
  <div class="warn" id="warn"></div>

  <div class="stats" id="kpis"></div>

  <div class="two">
    <div class="card">
      <h2>Balance Sheet<b>貸借対照表（年度末時点）</b></h2>
      <div class="bs-grid">
        <div><table class="cmp fs" id="bsL"></table></div>
        <div><table class="cmp fs" id="bsR"></table></div>
      </div>
    </div>
    <div class="card">
      <h2>Profit &amp; Loss<b>損益計算書（当年度）</b></h2>
      <table class="cmp fs pl" id="pl"></table>
    </div>
  </div>

  <div class="two">
    <div class="card">
      <h2>Monthly<b>月次の収益・費用</b></h2>
      <div class="legend"><span><i style="background:var(--lv1)"></i>収益</span><span><i style="background:var(--lv2)"></i>費用</span></div>
      <div class="chart"><canvas id="cMonthly" aria-label="月次の収益と費用"></canvas></div>
    </div>
    <div class="card">
      <h2>Expenses<b>費用の内訳（勘定科目別）</b></h2>
      <div class="chart" id="expWrap"><canvas id="cExp" aria-label="費用の内訳"></canvas></div>
    </div>
  </div>

  <div class="card">
    <h2>Cash<b>資金残高の推移（小口現金＋普通預金、月末）</b></h2>
    <div class="chart"><canvas id="cCash" aria-label="資金残高の推移"></canvas></div>
  </div>

  <div class="card" id="budgetCard">
    <h2>Budget<b>予算対比（予算大項目・中項目・小項目／費用・税込）</b></h2>
    <div class="btb">
      <div class="grp"><span class="fl">表示する予算</span><div class="chips" id="verBtns"></div></div>
      <div class="grp"><span class="fl">階層</span>
        <button type="button" class="chip" data-lv="1">大項目</button>
        <button type="button" class="chip" data-lv="2">中項目まで</button>
        <button type="button" class="chip" data-lv="3">小項目まで</button>
      </div>
    </div>
    <div class="bnote" id="budgetNote"></div>
    <div class="bwrap"><table class="btbl" id="budgetTbl"></table></div>
  </div>

  <div class="card">
    <h2>Recent<b>当年度の仕訳（新しい順・15件）</b></h2>
    <table id="recent"></table>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/model.js"></script>
<script src="js/store.js"></script>
<script src="js/widgets.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
